name: harvest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of the data repository to run against (blank = its default branch)'
        required: false
      systems:
        description: 'Comma-separated hiring systems (blank = every system that has a row parser)'
        default: ''
        required: false
      shards:
        description: 'Slices per system'
        default: '4'
        required: false
      max_minutes:
        description: 'Minutes each shard may read before it stops and reports what it did not reach'
        default: '40'
        required: false
      workday_surface:
        description: 'Workday only: cxs (the JSON list, throttled per address), sitemap (siteMap.xml plus each page JobPosting) or auto (sitemap, and the CXS list too when the sitemap is a window)'
        default: 'auto'
        required: false
      workday_pass:
        description: 'Workday only: all (boards with in-box inventory first, then the rest) or inbox (only boards the sweep measured with in-box postings)'
        default: 'inbox'
        required: false
      bodies:
        description: 'Descriptions pass: read only the boards that hold an eligible posting with no description yet, and keep the description of exactly those postings'
        type: boolean
        default: false
      observe_only:
        description: 'Only prove the storage ladder (upload a lake, download it in a second job), read no board'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youwork-market-harvest
  cancel-in-progress: false

defaults:
  run:
    shell: node engine/ci/quiet-shell.mjs {0}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned: ${{ steps.plan.outputs.planned }}
    steps:
      - name: Decide where this run reads and writes
        shell: bash
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$DATA_REPO" ]; then
            echo "QUIET_LOGS=1" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-master}" >> "$GITHUB_ENV"
          else
            echo "QUIET_LOGS=" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.DATA_REPO || github.repository }}
          token: ${{ secrets.DATA_TOKEN || github.token }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Build, plan and publish the lake
        id: plan
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || github.token }}
          DATA_SLUG: ${{ secrets.DATA_REPO || github.repository }}
          SYSTEMS: ${{ inputs.systems }}
          SHARDS: ${{ inputs.shards }}
          OBSERVE: ${{ inputs.observe_only }}
        run: |
          mkdir -p .market
          base=$(gh api "repos/${DATA_SLUG}/releases/tags/market-lake" --jq '[.assets[]|select(.name|startswith("lake-merged-"))]|sort_by(.created_at)|last|.id // empty' 2>/dev/null || true)
          keep=""
          if [ -n "$base" ]; then
            gh api -H "Accept: application/octet-stream" "repos/${DATA_SLUG}/releases/assets/${base}" > .market/base.sqlite.gz
            gunzip -f .market/base.sqlite.gz && mv .market/base.sqlite .market/lake.sqlite && keep="--keep"
            echo "base lake: release asset ${base}"
          fi
          node engine/market.mjs build $keep | tee /tmp/build.log
          node engine/market-harvest.mjs check --lake .market/lake.sqlite
          set -- --lake .market/lake.sqlite --shards "${SHARDS:-4}"
          if [ -n "$SYSTEMS" ]; then set -- "$@" --systems "$SYSTEMS"; fi
          if [ "$OBSERVE" = "true" ]; then set -- --lake .market/lake.sqlite --shards 1 --systems "${SYSTEMS:-greenhouse}"; fi
          node engine/market-harvest.mjs plan "$@" > /tmp/plan.json
          echo "matrix=$(node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8"));console.log(JSON.stringify({include:p.include}))')" >> "$GITHUB_OUTPUT"
          cat /tmp/plan.json
          echo "planned=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8")).include.length)')" >> "$GITHUB_OUTPUT"
          gzip -k -f .market/lake.sqlite
          ls -l .market/
          gh release view market-lake --repo "$DATA_SLUG" >/dev/null 2>&1 || gh release create market-lake --repo "$DATA_SLUG" --prerelease --title "Market lake (private)" --notes "Lake snapshots and shard parts. Private. Never public."
          cp .market/lake.sqlite.gz "lake-${GITHUB_RUN_ID}.sqlite.gz"
          gh release upload market-lake "lake-${GITHUB_RUN_ID}.sqlite.gz" --repo "$DATA_SLUG" --clobber
          echo "uploaded lake-${GITHUB_RUN_ID}.sqlite.gz ($(stat -c %s .market/lake.sqlite.gz) bytes)"

      - name: Save the quiet logs in the data repository
        if: ${{ always() && env.QUIET_LOGS == '1' }}
        shell: bash
        run: node engine/ci/save-logs.mjs

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Decide where this run reads and writes
        shell: bash
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$DATA_REPO" ]; then
            echo "QUIET_LOGS=1" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-master}" >> "$GITHUB_ENV"
          else
            echo "QUIET_LOGS=" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.DATA_REPO || github.repository }}
          token: ${{ secrets.DATA_TOKEN || github.token }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch and run through the release store
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || github.token }}
          DATA_SLUG: ${{ secrets.DATA_REPO || github.repository }}
          ATS: ${{ matrix.ats }}
          SLICE: ${{ matrix.slice }}
          NAME: ${{ matrix.name }}
          MAXMIN: ${{ inputs.max_minutes }}
          OBSERVE: ${{ inputs.observe_only }}
          WDSURFACE: ${{ inputs.workday_surface }}
          WDPASS: ${{ inputs.workday_pass }}
          BODIES: ${{ inputs.bodies }}
        run: |
          mkdir -p .market parts
          gh release download market-lake --repo "$DATA_SLUG" --pattern "lake-${GITHUB_RUN_ID}.sqlite.gz" --dir .market --clobber
          gunzip -f ".market/lake-${GITHUB_RUN_ID}.sqlite.gz"
          mv ".market/lake-${GITHUB_RUN_ID}.sqlite" .market/lake.sqlite
          node engine/market-harvest.mjs check --lake .market/lake.sqlite
          set -- --ats "$ATS" --slice "$SLICE" --part "parts/part-${NAME}.sqlite" --run "h-${GITHUB_RUN_ID}" --max-minutes "${MAXMIN:-40}"
          if [ "$OBSERVE" = "true" ]; then set -- "$@" --limit 2; fi
          if [ "$ATS" = "workday" ]; then set -- "$@" --surface "${WDSURFACE:-auto}" --pass "${WDPASS:-inbox}"; fi
          if [ "$BODIES" = "true" ]; then set -- "$@" --bodies auto; fi
          node engine/market-harvest.mjs shard "$@" | tee "/tmp/shard-${NAME}.log"
          gzip -k -f "parts/part-${NAME}.sqlite"
          cp "parts/part-${NAME}.sqlite.gz" "part-${GITHUB_RUN_ID}-${NAME}.sqlite.gz"
          cp "parts/part-${NAME}.sqlite.counters.json" "counters-${GITHUB_RUN_ID}-${NAME}.json"
          gh release upload market-lake "part-${GITHUB_RUN_ID}-${NAME}.sqlite.gz" "counters-${GITHUB_RUN_ID}-${NAME}.json" --repo "$DATA_SLUG" --clobber

  merge:
    needs: [prepare, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Decide where this run reads and writes
        shell: bash
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$DATA_REPO" ]; then
            echo "QUIET_LOGS=1" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-master}" >> "$GITHUB_ENV"
          else
            echo "QUIET_LOGS=" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.DATA_REPO || github.repository }}
          token: ${{ secrets.DATA_TOKEN || github.token }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch and run through the release store
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || github.token }}
          DATA_SLUG: ${{ secrets.DATA_REPO || github.repository }}
          PLANNED: ${{ needs.prepare.outputs.planned }}
        run: |
          mkdir -p .market parts /tmp/ctr
          gh release download market-lake --repo "$DATA_SLUG" --pattern "lake-${GITHUB_RUN_ID}.sqlite.gz" --dir .market --clobber
          gunzip -f ".market/lake-${GITHUB_RUN_ID}.sqlite.gz"
          mv ".market/lake-${GITHUB_RUN_ID}.sqlite" .market/lake.sqlite
          gh release download market-lake --repo "$DATA_SLUG" --pattern "part-${GITHUB_RUN_ID}-*.sqlite.gz" --dir parts --clobber || echo "no parts (every shard failed)"
          gh release download market-lake --repo "$DATA_SLUG" --pattern "counters-${GITHUB_RUN_ID}-*.json" --dir /tmp/ctr --clobber || true
          for f in parts/*.sqlite.gz; do if [ -e "$f" ]; then gunzip -f "$f"; fi; done
          for f in /tmp/ctr/counters-*.json; do if [ -e "$f" ]; then mv "$f" "${f%.json}.counters.json"; fi; done
          parts=$(ls parts/part-*.sqlite 2>/dev/null | paste -sd, - || true)
          if [ -n "$parts" ]; then
            node engine/market-harvest.mjs merge --lake .market/lake.sqlite --parts "$parts" --run "h-${GITHUB_RUN_ID}" | tee /tmp/merge.json
          else
            echo '{}' > /tmp/merge.json
          fi
          node engine/market-harvest.mjs settle --lake .market/lake.sqlite | tee /tmp/settle.json
          node engine/market.mjs build --keep | tee /tmp/enrich.log > /dev/null
          node engine/market-harvest.mjs check --lake .market/lake.sqlite
          gzip -k -f .market/lake.sqlite
          cp .market/lake.sqlite.gz "lake-merged-${GITHUB_RUN_ID}.sqlite.gz"
          gh release upload market-lake "lake-merged-${GITHUB_RUN_ID}.sqlite.gz" --repo "$DATA_SLUG" --clobber
          gh api "repos/${DATA_SLUG}/releases/tags/market-lake" --jq '.assets' > /tmp/assets.json || echo '[]' > /tmp/assets.json
          node engine/market-harvest.mjs prune --assets /tmp/assets.json --keep 2 --run "${GITHUB_RUN_ID}" > /tmp/prune.json || echo '[]' > /tmp/prune.json
          for id in $(node -e 'for (const a of JSON.parse(require("fs").readFileSync("/tmp/prune.json","utf8"))) console.log(a.id)'); do gh api -X DELETE "repos/${DATA_SLUG}/releases/assets/${id}" || true; done
          echo "pruned $(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/prune.json","utf8")).length)') old release assets"
          rc=0
          node engine/market-harvest.mjs counters --dir /tmp/ctr --merge /tmp/merge.json --settle /tmp/settle.json --planned "$PLANNED" --run "h-${GITHUB_RUN_ID}" || rc=$?
          echo "counters_rc=$rc" > /tmp/counters_rc

      - name: Commit health.json and nothing else
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN || github.token }}
          DATA_SLUG: ${{ secrets.DATA_REPO || github.repository }}
        run: |
          git config user.name  "youwork-market-harvest"
          git config user.email "market-harvest@users.noreply.github.com"
          stray=$(git diff --name-only | grep -v -e '^data/market/health.json$' -e '^data/ci-logs/' || true)
          if [ -n "$stray" ]; then
            echo "::error title=The harvest modified files outside data/market/health.json::$(echo "$stray" | tr '\n' ' ')"
            exit 1
          fi
          git add data/market/health.json
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "market-harvest: counters for run ${GITHUB_RUN_ID} [skip ci]"
          pushed=""
          conflicted=""
          for i in 1 2 3 4; do
            if git push origin "HEAD:${DATA_BRANCH}"; then pushed=yes; break; fi
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
            if ! git pull --rebase --autostash origin "${DATA_BRANCH}"; then
              echo "::warning title=Rebase conflicted::aborting and retrying from our own commit"
              conflicted=yes
              git rebase --abort || true
            fi
          done
          if [ -z "$pushed" ] && [ -n "$conflicted" ]; then echo "::error title=Harvest counters were not committed::another run changed data/market/health.json while this one worked"; exit 1; fi
          if [ -z "$pushed" ]; then echo "::error title=Harvest counters were not committed::4 push attempts failed"; exit 1; fi
          if [ -f /tmp/counters_rc ] && ! grep -q 'counters_rc=0' /tmp/counters_rc; then
            echo "::error title=Harvest counters disagree::shard rows written differ from merge rows in, or a planned shard never reported (data/market/health.json harvest.consistency)"
            exit 1
          fi

      - name: Save the quiet logs in the data repository
        if: ${{ always() && env.QUIET_LOGS == '1' }}
        shell: bash
        run: node engine/ci/save-logs.mjs
