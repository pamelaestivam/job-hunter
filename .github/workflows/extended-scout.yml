name: extended-scout

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of the data repository to run against (blank = its default branch)'
        required: false
      only:
        description: 'Comma-separated company ids to fetch (blank = all). Leave blank in a public run: inputs are shown on its page.'
        default: ''
        required: false
      recrawl:
        description: 'Company ids to re-read from scratch, ignoring the rung-3 read log. Leave blank in a public run: inputs are shown on its page.'
        default: ''
        required: false
      verify:
        description: 'Fetch-verify the extended corpus at or above the review bar before committing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: youwork-corpus-write
  cancel-in-progress: false

defaults:
  run:
    shell: node engine/ci/quiet-shell.mjs {0}

jobs:
  extended-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUWORK_BOX: extended
      YOUWORK_DATA_DIR: ${{ github.workspace }}/data/extended
    steps:
      - name: Record when this run started
        shell: bash
        run: echo "RUN_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Decide where this run reads and writes
        shell: bash
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$DATA_REPO" ]; then
            echo "QUIET_LOGS=1" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-master}" >> "$GITHUB_ENV"
          else
            echo "QUIET_LOGS=" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.DATA_REPO || github.repository }}
          token: ${{ secrets.DATA_TOKEN || github.token }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Self-test the engine in the default box
        env:
          YOUWORK_BOX: ''
          YOUWORK_DATA_DIR: ''
        run: node engine/test/run.mjs

      - name: Seed data/extended
        run: |
          mkdir -p data/extended/digest
          for f in seen.json jobs.json health.json read-log.json box-inventory.json liveness.json; do
            if [ ! -f "data/extended/$f" ] && [ -f "data/$f" ]; then cp "data/$f" "data/extended/$f"; echo "seeded $f"; fi
          done
          for f in pipeline.json decisions.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "data/extended/$f"; fi
          done

      - name: Run the extended search
        env:
          ONLY: ${{ inputs.only }}
          RECRAWL: ${{ inputs.recrawl }}
        run: |
          set -- --profile=pamela
          if [ -n "$ONLY" ]; then set -- "$@" --only="$ONLY" --force-partial; fi
          if [ -n "$RECRAWL" ]; then set -- "$@" --recrawl="$RECRAWL"; fi
          node engine/scout.mjs "$@" | tee /tmp/extended-scout.log

      - name: Fetch-verify the extended corpus
        if: ${{ inputs.verify == true }}
        run: node engine/verify-live.mjs --band --limit=400 | tee /tmp/extended-live.log

      - name: Rebuild the extended digest from the fresh verdicts
        if: ${{ inputs.verify == true }}
        run: node engine/rerender.mjs | tee -a /tmp/extended-live.log

      - name: Check data/extended holds together
        run: node engine/verify-data.mjs

      - name: Write the KPI scoreboard
        run: node engine/kpi.mjs --write >> "$GITHUB_STEP_SUMMARY" || true

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Extended-box search, $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "> The Peninsula up to and including San Francisco. Not her default commute box."
            echo
            if [ -f data/extended/jobs.json ]; then
              node -e '
                const d = require("./data/extended/jobs.json");
                const h = require("./data/extended/health.json");
                const started = Date.parse(process.env.RUN_STARTED_AT || "");
                const produced = Date.parse(d.generated_at || "");
                if (Number.isFinite(started) && Number.isFinite(produced) && produced < started) {
                  console.log(`> STALE: this run produced no output. What follows is the last committed result.`);
                  console.log();
                }
                const ext = d.jobs.filter(j => j.geo && j.geo.tier === "extension");
                const byCo = {};
                for (const j of ext) byCo[j.company] = (byCo[j.company] || 0) + 1;
                console.log(`**${d.jobs.length} roles in the extended box, ${ext.length} of them only because of the extension.**`);
                console.log();
                console.log(`Feeds answered ${h.companies_ok}/${h.companies_total}; box stamp: ${d.box}.`);
                console.log();
                console.log("| Employer | Extension-only roles |");
                console.log("|---|---:|");
                for (const [c, n] of Object.entries(byCo).sort((a, b) => b[1] - a[1])) console.log(`| ${c} | ${n} |`);
              '
            else
              echo "No extended corpus was written. Check the step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data/extended and nothing else
        run: |
          git config user.name  "youwork-extended-scout"
          git config user.email "extended-scout@users.noreply.github.com"
          stray=$(git diff --name-only | grep -v -e '^data/extended/' -e '^data/ci-logs/' || true)
          if [ -n "$stray" ]; then
            echo "::error title=An extended-run tool modified files outside data/extended/::$(echo "$stray" | tr '\n' ' ')"
            echo "$stray"
            exit 1
          fi
          git add -A data/extended/
          if git diff --staged --quiet; then
            echo "No change in the extended box since the last run."
            exit 0
          fi
          if git diff --staged --name-only | grep -v '^data/extended/'; then
            echo "::error title=Extended run staged a file outside data/extended/::refusing to commit"
            exit 1
          fi
          n=$(node -p 'require("./data/extended/jobs.json").jobs.filter(j=>j.geo&&j.geo.tier==="extension").length')
          git commit -m "extended-scout: the extended box, ${n} extension-only roles [skip ci]"
          pushed=""
          for i in 1 2 3 4; do
            if git push origin "HEAD:${DATA_BRANCH}"; then pushed=yes; break; fi
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
            if ! git pull --rebase --autostash origin "${DATA_BRANCH}"; then
              echo "::warning title=Rebase conflicted::aborting and retrying from our own commit"
              git rebase --abort || true
            fi
          done
          if [ -z "$pushed" ]; then
            echo "::error title=Extended-box results were not committed::4 push attempts failed."
            exit 1
          fi

      - name: Save the quiet logs in the data repository
        if: ${{ always() && env.QUIET_LOGS == '1' }}
        shell: bash
        run: node engine/ci/save-logs.mjs
