name: remote-scout

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of the data repository to run against (blank = its default branch)'
        required: false
      only:
        description: 'Comma-separated company ids to fetch (blank = all)'
        default: ''
        required: false
      recrawl:
        description: 'Company ids to re-read from scratch, ignoring the rung-3 read log'
        default: ''
        required: false
      verify:
        description: 'Fetch-verify the remote corpus at or above the review bar before committing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: youwork-corpus-write
  cancel-in-progress: false

defaults:
  run:
    shell: node engine/ci/quiet-shell.mjs {0}

jobs:
  remote-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUWORK_BOX: remote
      YOUWORK_DATA_DIR: ${{ github.workspace }}/data/remote
    steps:
      - name: Record when this run started
        shell: bash
        run: echo "RUN_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Decide where this run reads and writes
        shell: bash
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$DATA_REPO" ]; then
            echo "QUIET_LOGS=1" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-master}" >> "$GITHUB_ENV"
          else
            echo "QUIET_LOGS=" >> "$GITHUB_ENV"
            echo "DATA_BRANCH=${INPUT_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ secrets.DATA_REPO || github.repository }}
          token: ${{ secrets.DATA_TOKEN || github.token }}
          ref: ${{ env.DATA_BRANCH }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Self-test the engine in the default box
        env:
          YOUWORK_BOX: ''
          YOUWORK_DATA_DIR: ''
        run: node engine/test/run.mjs

      - name: Seed data/remote
        run: |
          mkdir -p data/remote/digest
          for f in pipeline.json decisions.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "data/remote/$f"; fi
          done

      - name: Run the remote search
        env:
          ONLY: ${{ inputs.only }}
          RECRAWL: ${{ inputs.recrawl }}
        run: |
          set -- --profile=pamela
          if [ -n "$ONLY" ]; then set -- "$@" --only="$ONLY" --force-partial; fi
          if [ -n "$RECRAWL" ]; then set -- "$@" --recrawl="$RECRAWL"; fi
          node engine/scout.mjs "$@" | tee /tmp/remote-scout.log

      - name: Fetch-verify the remote corpus
        if: ${{ inputs.verify == true }}
        run: node engine/verify-live.mjs --band --limit=400 | tee /tmp/remote-live.log

      - name: Rebuild the remote digest from the fresh verdicts
        if: ${{ inputs.verify == true }}
        run: node engine/rerender.mjs | tee -a /tmp/remote-live.log

      - name: Check data/remote holds together
        run: node engine/verify-data.mjs

      - name: Write the KPI scoreboard
        run: node engine/kpi.mjs --write >> "$GITHUB_STEP_SUMMARY" || true

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Remote-seats search, $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "> Remote seats at top and high tier employers. Not her commute box."
            echo
            if [ -f data/remote/jobs.json ]; then
              node -e '
                const d = require("./data/remote/jobs.json");
                const h = require("./data/remote/health.json");
                const started = Date.parse(process.env.RUN_STARTED_AT || "");
                const produced = Date.parse(d.generated_at || "");
                if (Number.isFinite(started) && Number.isFinite(produced) && produced < started) {
                  console.log(`> STALE: this run produced no output. What follows is the last committed result.`);
                  console.log();
                }
                const us = d.jobs.filter(j => j.geo && j.geo.verdict === "in_box");
                const unstated = d.jobs.filter(j => j.geo && j.geo.verdict === "ambiguous");
                const byCo = {};
                for (const j of d.jobs) byCo[j.company] = (byCo[j.company] || 0) + 1;
                console.log(`**${d.jobs.length} remote roles: ${us.length} say US remote, ${unstated.length} do not state a country.**`);
                console.log();
                console.log(`Feeds answered ${h.companies_ok}/${h.companies_total}; box stamp: ${d.box}.`);
                console.log();
                console.log("| Employer | Remote roles |");
                console.log("|---|---:|");
                for (const [c, n] of Object.entries(byCo).sort((a, b) => b[1] - a[1])) console.log(`| ${c} | ${n} |`);
              '
            else
              echo "No remote corpus was written. Check the step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data/remote and nothing else
        run: |
          git config user.name  "youwork-remote-scout"
          git config user.email "remote-scout@users.noreply.github.com"
          stray=$(git diff --name-only | grep -v '^data/remote/' || true)
          if [ -n "$stray" ]; then
            echo "::error title=A remote-run tool modified files outside data/remote/::$(echo "$stray" | tr '\n' ' ')"
            echo "$stray"
            exit 1
          fi
          git add -A data/remote/
          if git diff --staged --quiet; then
            echo "No change in the remote box since the last run."
            exit 0
          fi
          if git diff --staged --name-only | grep -v '^data/remote/'; then
            echo "::error title=Remote run staged a file outside data/remote/::refusing to commit"
            exit 1
          fi
          n=$(node -p 'require("./data/remote/jobs.json").jobs.length')
          git commit -m "remote-scout: ${n} remote roles [skip ci]"
          pushed=""
          for i in 1 2 3 4; do
            if git push origin "HEAD:${DATA_BRANCH}"; then pushed=yes; break; fi
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
            if ! git pull --rebase origin "${DATA_BRANCH}"; then
              echo "::warning title=Rebase conflicted::aborting and retrying from our own commit"
              git rebase --abort || true
            fi
          done
          if [ -z "$pushed" ]; then
            echo "::error title=Remote-box results were not committed::4 push attempts failed."
            exit 1
          fi

      - name: Save the quiet logs in the data repository
        if: ${{ always() && env.QUIET_LOGS == '1' }}
        shell: bash
        run: node engine/ci/save-logs.mjs
