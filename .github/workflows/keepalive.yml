name: keepalive

on:
  schedule:
    - cron: '17 6 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .heartbeat
          git commit -m "keepalive"
          git push
          for wf in scout.yml pulse.yml verify-live.yml keepalive.yml; do
            gh workflow enable "$wf" || true
          done
